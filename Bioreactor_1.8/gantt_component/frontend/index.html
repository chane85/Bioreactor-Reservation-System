<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gantt</title>
  <script src="https://unpkg.com/vis-timeline@7.7.3/standalone/umd/vis-timeline-graph2d.min.js"></script>
  <link href="https://unpkg.com/vis-timeline@7.7.3/styles/vis-timeline-graph2d.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: white; font-family: Arial, sans-serif; }
    #timeline { width: 100%; }
    .vis-item.vis-range { border-radius: 3px; border-width: 1px !important; }
    .vis-item.vis-range .vis-item-overflow { overflow: visible; }
    .vis-label { font-size: 11px; padding: 2px 4px; }
    .vis-custom-time.today { background-color: #FF4B4B; width: 2px; cursor: default; }
    .vis-custom-time.today > .vis-custom-time-marker {
      background-color: #FF4B4B; color: white; font-size: 10px; padding: 1px 4px; white-space: nowrap;
    }
    .vis-custom-time.hl { background-color: #2979FF; width: 2px; cursor: default; }
    .vis-custom-time.hl > .vis-custom-time-marker {
      background-color: #2979FF; color: white; font-size: 10px; padding: 1px 4px; white-space: nowrap;
    }
    .vis-item.vis-background.weekend { background-color: rgba(255,200,200,0.30); }
  </style>
</head>
<body>
  <div id="timeline"></div>
  <script>
    const DAY_MS = 86400000;
    let timeline = null;
    let itemsDS  = null;
    let groupsDS = null;

    function fmt(d) {
      const dt = (d instanceof Date) ? d : new Date(d);
      const y = dt.getFullYear();
      const m = String(dt.getMonth() + 1).padStart(2, '0');
      const day = String(dt.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /* Weekend background items for the visible window */
    function buildWeekendItems(winStart, winEnd) {
      const items = [];
      let id = 0;
      let d = new Date(winStart);
      d.setHours(0, 0, 0, 0);
      while (d <= winEnd) {
        const dow = d.getDay();
        if (dow === 6 || dow === 0) {
          const s = new Date(d);
          const e = new Date(d.getTime() + DAY_MS);
          items.push({ id: `wk_${id++}`, start: s, end: e, type: 'background', className: 'weekend' });
        }
        d = new Date(d.getTime() + DAY_MS);
      }
      return items;
    }

    function buildBookingItems(bookings) {
      return bookings.map(b => ({
        id:      b.booking_id,
        group:   b.reactor_id,
        content: `<span style="color:${b.font_color||'#fff'};font-weight:bold;font-size:11px;white-space:nowrap;pointer-events:none">${b.project}</span>`,
        start:   new Date(b.start),
        end:     new Date(new Date(b.end).getTime() + DAY_MS), /* vis uses exclusive end */
        style:   `background-color:${b.color||'#888'};border-color:rgba(0,0,0,0.3);`,
        title:   `<b>${b.project}</b> (${b.stage})<br>User: ${b.user}<br>${b.start} ~ ${b.end}`,
        editable: { updateTime: true, updateGroup: true, remove: false },
      }));
    }

    function buildGroups(reactors, hpr) {
      return reactors.map(r => ({
        id:      r.id,
        content: `<span style="font-size:11px;font-weight:bold">${r.label}</span>`,
        style:   `height:${hpr}px;line-height:${hpr}px;`,
      }));
    }

    function render(args) {
      const { bookings, reactors, highlight_date, height_per_row } = args;
      if (!bookings || !reactors || reactors.length === 0) return;

      const HPR    = height_per_row || 28;
      const totalH = reactors.length * HPR + 80;
      const now    = new Date();
      const winS   = new Date(now.getTime() - 7  * DAY_MS);
      const winE   = new Date(now.getTime() + 63 * DAY_MS);

      const allItems = [
        ...buildWeekendItems(winS, winE),
        ...buildBookingItems(bookings),
      ];
      const groups = buildGroups(reactors, HPR);

      if (!timeline) {
        itemsDS  = new vis.DataSet(allItems);
        groupsDS = new vis.DataSet(groups);

        const options = {
          start:  winS,
          end:    winE,
          stack:  false,
          orientation:    { axis: 'top', item: 'top' },
          height:         totalH,
          groupHeightMode:'fixed',
          groupOrder:     (a, b) => reactors.findIndex(r => r.id === a.id) - reactors.findIndex(r => r.id === b.id),
          editable:       { updateTime: true, updateGroup: true, remove: false },
          snap: date => {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            return d;
          },
          onMove: (item, callback) => {
            /* vis end is exclusive — subtract 1 day to get inclusive end */
            const newStart = fmt(item.start);
            const newEnd   = fmt(new Date(new Date(item.end).getTime() - DAY_MS));
            Streamlit.setComponentValue({
              action:        'move',
              booking_id:    String(item.id),
              new_reactor_id: item.group,
              new_start:     newStart,
              new_end:       newEnd,
              ts:            Date.now(),
            });
            callback(item); /* optimistic accept; Python reverts on conflict */
          },
          tooltip:   { followMouse: true, overflowMethod: 'cap' },
          zoomMin:   7   * DAY_MS,
          zoomMax:   180 * DAY_MS,
          selectable:     true,
          multiselect:    false,
        };

        timeline = new vis.Timeline(
          document.getElementById('timeline'),
          itemsDS,
          groupsDS,
          options
        );
        timeline.on('changed', () => {
          Streamlit.setFrameHeight(document.getElementById('timeline').offsetHeight + 10);
        });

      } else {
        /* Update data in place — avoids full re-init on every Streamlit rerun */
        itemsDS.clear();
        itemsDS.add(allItems);
        groupsDS.clear();
        groupsDS.add(groups);
        timeline.setOptions({ height: totalH });
      }

      /* Today marker */
      try { timeline.removeCustomTime('today'); } catch(e) {}
      timeline.addCustomTime(now, 'today');
      try { timeline.setCustomTimeMarker('Today', 'today', false); } catch(e) {}

      /* Highlight date marker */
      try { timeline.removeCustomTime('hl'); } catch(e) {}
      if (highlight_date) {
        timeline.addCustomTime(new Date(highlight_date + 'T00:00:00'), 'hl');
        try { timeline.setCustomTimeMarker(highlight_date, 'hl', false); } catch(e) {}
      }

      Streamlit.setFrameHeight(document.getElementById('timeline').offsetHeight + 10);
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, function(event) {
      render(event.detail.args);
    });
    Streamlit.setComponentReady();
  </script>
</body>
</html>
